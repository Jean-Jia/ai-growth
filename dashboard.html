<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jean的 AI 成长仪表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      background: #f0eef8;
      color: #1d1d1f;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1035 0%, #2d1b69 60%, #4c1d95 100%);
      color: white;
      padding: 2.5rem 3rem 2.5rem 340px;
      min-height: 320px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .header-bg-img {
      position: absolute;
      left: 0;
      top: -55px;
      width: 310px;
      height: auto;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to right, black 25%, rgba(0,0,0,0.5) 60%, transparent 95%);
      mask-image: linear-gradient(to right, black 25%, rgba(0,0,0,0.5) 60%, transparent 95%);
    }
    .header-top { display: flex; align-items: flex-start; position: relative; z-index: 1; }
    .header-label { font-size: 0.85rem; opacity: 0.6; font-weight: 400; margin-bottom: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .level-row { display: flex; align-items: baseline; gap: 1rem; }
    .level-num { font-size: 5rem; font-weight: 800; color: #c4b5fd; line-height: 1; }
    .level-name { font-size: 2.2rem; font-weight: 700; }
    .level-desc { margin-top: 0.6rem; opacity: 0.65; font-size: 0.95rem; line-height: 1.6; max-width: 500px; }

    /* ── Progress Bar ── */
    .progress-section {
      background: white;
      padding: 1.25rem 3rem;
      border-bottom: 1px solid #e8e0f5;
    }
    .progress-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
    .progress-meta-label { font-size: 0.8rem; color: #888; font-weight: 500; }
    .progress-meta-next { font-size: 0.8rem; color: #7c3aed; font-weight: 600; }
    .progress-track { display: flex; gap: 5px; }
    .progress-step {
      flex: 1; height: 10px; border-radius: 5px;
      background: #ede9fe;
      position: relative; cursor: default;
    }
    .progress-step.filled { background: #c4b5fd; }
    .progress-step.current { background: #7c3aed; box-shadow: 0 0 8px rgba(124,58,237,0.5); }
    .progress-step:hover::after {
      content: attr(data-label);
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
      background: #1a1035; color: white;
      padding: 3px 8px; border-radius: 6px;
      font-size: 0.72rem; white-space: nowrap;
      pointer-events: none; z-index: 10;
    }
    .progress-labels { display: flex; justify-content: space-between; margin-top: 0.5rem; }
    .progress-labels span { font-size: 0.72rem; color: #bbb; }

    /* ── Main grid ── */
    .main { padding: 2rem 3rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }

    .card {
      background: white; border-radius: 16px; padding: 1.5rem;
      box-shadow: 0 1px 4px rgba(76,29,149,0.07);
    }
    .card-title {
      font-size: 0.75rem; font-weight: 700; color: #9ca3af;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1.25rem;
    }

    /* ── Dimensions ── */
    .dim-list { display: flex; flex-direction: column; gap: 1.1rem; }
    .dim-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .dim-name { font-size: 0.9rem; font-weight: 600; }
    .dim-sub { font-size: 0.75rem; color: #aaa; font-weight: 400; }
    .dim-score { font-size: 1rem; font-weight: 800; color: #7c3aed; }
    .dim-bar { height: 7px; background: #f3f0ff; border-radius: 4px; overflow: hidden; }
    .dim-fill { height: 100%; background: linear-gradient(90deg, #c4b5fd, #7c3aed); border-radius: 4px; transition: width 1s ease; }

    /* ── Radar chart ── */
    .radar-wrap { position: relative; height: 300px; display: flex; align-items: center; justify-content: center; }

    /* ── Why Lv.7 ── */
    .why-card { margin-bottom: 1.5rem; }
    .why-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .why-item {
      display: flex; gap: 0.75rem; align-items: flex-start;
      padding: 0.75rem 1rem;
      background: #f9f7ff;
      border-radius: 10px;
      border-left: 3px solid #7c3aed;
    }
    .why-check {
      min-width: 20px; height: 20px;
      background: #7c3aed; color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 800; margin-top: 1px;
    }
    .why-text { font-size: 0.88rem; line-height: 1.6; color: #374151; }
    .why-label { font-weight: 700; color: #1d1d1f; }

    /* ── Timeline ── */
    .timeline-card { margin-bottom: 1.5rem; }
    .timeline-pills {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 0.5rem;
      scrollbar-width: thin; scrollbar-color: #e8e0f5 transparent;
    }
    .timeline-pills::-webkit-scrollbar { height: 4px; }
    .timeline-pills::-webkit-scrollbar-track { background: transparent; }
    .timeline-pills::-webkit-scrollbar-thumb { background: #e8e0f5; border-radius: 2px; }
    .tl-pill {
      flex-shrink: 0; padding: 0.35rem 0.85rem;
      border-radius: 20px; cursor: pointer;
      font-size: 0.8rem; font-weight: 600;
      border: 2px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .tl-pill.past { background: #ede9fe; color: #6d28d9; }
    .tl-pill.current { background: #7c3aed; color: white; box-shadow: 0 2px 8px rgba(124,58,237,0.4); }
    .tl-pill.future { background: #f3f0ff; color: #bbb; }
    .tl-pill.active { outline: 2px solid #7c3aed; outline-offset: 2px; }
    .tl-pill:hover { transform: translateY(-1px); }

    .tl-panel {
      margin-top: 1rem;
      padding: 1.25rem;
      background: #f9f7ff;
      border-radius: 12px;
      display: flex; gap: 1.25rem; align-items: flex-start;
    }
    .tl-panel-img {
      width: 120px; height: 120px; flex-shrink: 0;
      border-radius: 10px; object-fit: cover;
      box-shadow: 0 2px 8px rgba(76,29,149,0.15);
    }
    .tl-panel-img-placeholder {
      width: 120px; height: 120px; flex-shrink: 0;
      border-radius: 10px;
      background: #ede9fe;
      display: flex; align-items: center; justify-content: center;
      color: #c4b5fd; font-size: 2rem; font-weight: 800;
    }
    .tl-panel-body { flex: 1; }
    .tl-panel-header { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.5rem; }
    .tl-panel-lv { font-size: 1.5rem; font-weight: 800; color: #7c3aed; }
    .tl-panel-name { font-size: 1.1rem; font-weight: 700; }
    .tl-panel-badge {
      font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.5rem;
      border-radius: 20px; background: #7c3aed; color: white;
      margin-left: 0.25rem;
    }
    .tl-panel-badge.future-badge { background: #e5e7eb; color: #9ca3af; }
    .tl-panel-desc { font-size: 0.85rem; color: #6b7280; margin-bottom: 0.6rem; line-height: 1.55; }
    .tl-panel-evidence { font-size: 0.88rem; color: #374151; line-height: 1.65; }

    /* ── User Achievement Box ── */
    .user-achievement {
      margin-top: 0.75rem; padding: 0.7rem 0.9rem;
      background: #ede9fe; border-radius: 8px;
      border-left: 3px solid #7c3aed;
    }
    .user-achievement-label {
      font-size: 0.68rem; font-weight: 700; color: #7c3aed;
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.3rem;
    }
    .user-achievement-text { font-size: 0.84rem; color: #374151; line-height: 1.6; }

    /* ── Next steps ── */
    .steps-list { list-style: none; display: flex; flex-direction: column; gap: 0.85rem; }
    .steps-list li {
      display: flex; gap: 0.75rem; align-items: flex-start;
      font-size: 0.88rem; line-height: 1.55; color: #374151;
    }
    .step-icon {
      min-width: 22px; height: 22px; border-radius: 50%;
      background: #f3f0ff; color: #7c3aed;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 800; margin-top: 1px;
    }

    /* ── Projects ── */
    .section-title {
      font-size: 0.75rem; font-weight: 700; color: #9ca3af;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem;
    }
    .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .project-card {
      background: white; border-radius: 16px; padding: 1.25rem;
      box-shadow: 0 1px 4px rgba(76,29,149,0.07);
    }
    .project-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.25rem; }
    .project-name { font-size: 1rem; font-weight: 700; }
    .project-open {
      font-size: 0.72rem; color: #7c3aed; font-weight: 600;
      text-decoration: none; padding: 0.2rem 0.55rem;
      border: 1px solid #ede9fe; border-radius: 6px;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .project-open:hover { background: #ede9fe; }
    .project-path {
      font-size: 0.7rem; color: #bbb; font-family: monospace;
      margin-bottom: 0.6rem; word-break: break-all;
    }
    .project-desc { font-size: 0.82rem; color: #6b7280; margin-bottom: 1rem; line-height: 1.5; }
    .techniques { display: flex; flex-direction: column; gap: 0.45rem; }
    .tech-row { display: flex; align-items: flex-start; gap: 0.55rem; }
    .tag {
      padding: 0.18rem 0.6rem; border-radius: 20px;
      font-size: 0.7rem; font-weight: 700;
      white-space: nowrap; flex-shrink: 0;
    }
    .tag-automation { background: #dbeafe; color: #1d4ed8; }
    .tag-ai         { background: #ede9fe; color: #6d28d9; }
    .tag-infra      { background: #d1fae5; color: #065f46; }
    .tag-frontend   { background: #fef3c7; color: #92400e; }
    .tag-prompt     { background: #fce7f3; color: #9d174d; }
    .tech-use { font-size: 0.78rem; color: #6b7280; line-height: 1.4; padding-top: 0.1rem; }

    /* ── Project detail panel ── */
    .project-detail-toggle {
      margin-top: 0.9rem;
      width: 100%; padding: 0.4rem 0;
      background: #f3f0ff; color: #6d28d9;
      border: none; border-radius: 8px;
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .project-detail-toggle:hover { background: #ede9fe; }
    .project-detail-panel {
      display: none; margin-top: 0.85rem;
      border-top: 1px solid #ede9fe; padding-top: 0.85rem;
    }
    .project-detail-panel.open { display: block; }
    .detail-workflow {
      font-size: 0.78rem; color: #6d28d9; font-weight: 600;
      background: #f3f0ff; border-radius: 8px;
      padding: 0.55rem 0.75rem; margin-bottom: 0.85rem;
      line-height: 1.5;
    }
    .detail-section { margin-bottom: 0.75rem; }
    .detail-section-title {
      font-size: 0.75rem; font-weight: 700; color: #374151;
      margin-bottom: 0.35rem; letter-spacing: 0.02em;
    }
    .detail-section-list {
      list-style: none; display: flex; flex-direction: column; gap: 0.3rem;
    }
    .detail-section-list li {
      font-size: 0.76rem; color: #6b7280; line-height: 1.5;
      padding-left: 0.85rem; position: relative;
    }
    .detail-section-list li::before {
      content: "·"; position: absolute; left: 0;
      color: #c4b5fd; font-weight: 900;
    }

    /* ── Level Progress Overview ── */
    .lp-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.65rem; }
    .lp-label { font-size: 0.8rem; font-weight: 700; color: #374151; min-width: 130px; flex-shrink: 0; }
    .lp-bar { flex: 1; height: 10px; background: #f3f0ff; border-radius: 5px; overflow: hidden; }
    .lp-bar-fill { height: 100%; border-radius: 5px; transition: width 1s ease; }
    .lp-bar-fill.lp-past    { background: #c4b5fd; }
    .lp-bar-fill.lp-current { background: linear-gradient(90deg, #c4b5fd, #7c3aed); }
    .lp-bar-fill.lp-future  { background: #ddd6fe; }
    .lp-pct { font-size: 0.8rem; font-weight: 700; color: #7c3aed; min-width: 38px; text-align: right; flex-shrink: 0; }
    .lp-status { font-size: 0.68rem; padding: 0.1rem 0.45rem; border-radius: 10px; font-weight: 700; flex-shrink: 0; }
    .lp-status-done    { background: #d1fae5; color: #065f46; }
    .lp-status-current { background: #ede9fe; color: #6d28d9; }
    .lp-status-future  { background: #f3f4f6; color: #9ca3af; }

    /* ── Criteria checklist in timeline panel ── */
    .criteria-header { display: flex; justify-content: space-between; align-items: center; margin-top: 0.85rem; margin-bottom: 0.45rem; }
    .criteria-header-label { font-size: 0.74rem; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.06em; }
    .criteria-pct { font-size: 0.95rem; font-weight: 800; color: #7c3aed; }
    .criteria-track { height: 7px; background: #f3f0ff; border-radius: 4px; overflow: hidden; margin-bottom: 0.7rem; }
    .criteria-fill { height: 100%; background: linear-gradient(90deg, #c4b5fd, #7c3aed); border-radius: 4px; transition: width 0.8s ease; }
    .criteria-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .criterion-item { display: flex; align-items: flex-start; gap: 0.55rem; }
    .criterion-dot { min-width: 17px; height: 17px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 900; margin-top: 2px; flex-shrink: 0; }
    .criterion-done    .criterion-dot { background: #059669; color: white; }
    .criterion-partial .criterion-dot { background: #d97706; color: white; }
    .criterion-not     .criterion-dot { background: #fee2e2; color: #dc2626; border: 1.5px solid #fca5a5; }
    .criterion-done    .criterion-text { font-size: 0.82rem; color: #374151; line-height: 1.5; }
    .criterion-partial .criterion-text { font-size: 0.82rem; color: #6b7280; line-height: 1.5; }
    .criterion-not     .criterion-text { font-size: 0.82rem; color: #dc2626; line-height: 1.5; }

    /* ── Skills section ── */
    .skills-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem;
    }
    .skill-card {
      background: #f9f7ff; border-radius: 10px; padding: 0.85rem 1rem;
      border-left: 3px solid #c4b5fd;
      display: flex; flex-direction: column; gap: 0.3rem;
    }
    .skill-cat-workflow  { border-color: #7c3aed; }
    .skill-cat-debug     { border-color: #dc2626; }
    .skill-cat-memory    { border-color: #d97706; }
    .skill-cat-infra     { border-color: #059669; }
    .skill-cat-data      { border-color: #0891b2; }
    .skill-cat-frontend  { border-color: #f59e0b; }
    .skill-header { display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap; }
    .skill-name { font-size: 0.88rem; font-weight: 700; font-family: monospace; color: #1d1d1f; }
    .skill-invoke {
      font-size: 0.72rem; font-family: monospace;
      background: #ede9fe; color: #6d28d9;
      padding: 0.1rem 0.45rem; border-radius: 4px;
    }
    .skill-desc { font-size: 0.8rem; color: #374151; line-height: 1.5; }
    .skill-trigger { font-size: 0.74rem; color: #9ca3af; }

    /* ── Skill origin badge ── */
    .origin-badge {
      font-size: 0.65rem; font-weight: 700;
      padding: 0.1rem 0.45rem; border-radius: 10px;
      white-space: nowrap; flex-shrink: 0;
    }
    .origin-self    { background: #d1fae5; color: #065f46; }
    .origin-global  { background: #dbeafe; color: #1d4ed8; }
    .origin-project { background: #fef3c7; color: #92400e; }

    /* ── Skill tip ── */
    .skill-tip {
      font-size: 0.73rem; color: #7c3aed;
      background: #f5f3ff; border-radius: 6px;
      padding: 0.25rem 0.55rem; margin-top: 0.15rem;
      line-height: 1.5;
    }
    .skill-tip::before { content: "💡 "; }

    /* ── Dim improve hint ── */
    .dim-improve {
      font-size: 0.73rem; color: #6b7280;
      margin-top: 0.35rem; line-height: 1.5;
      padding-left: 0.1rem;
    }
    .dim-improve::before { content: "→ "; color: #c4b5fd; font-weight: 700; }

    /* ── Unused Tools section ── */
    .unused-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.85rem;
    }
    .unused-card {
      background: white; border-radius: 12px; padding: 1rem 1.1rem;
      box-shadow: 0 1px 3px rgba(76,29,149,0.06);
      border-top: 3px solid #e5e7eb;
    }
    .unused-cat-automation { border-color: #93c5fd; }
    .unused-cat-infra      { border-color: #6ee7b7; }
    .unused-cat-frontend   { border-color: #fcd34d; }
    .unused-cat-ai         { border-color: #c4b5fd; }
    .unused-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .unused-name { font-size: 0.92rem; font-weight: 700; }
    .unused-desc { font-size: 0.78rem; color: #6b7280; line-height: 1.55; }
    .tool-priority-now {
      font-size: 0.65rem; font-weight: 700;
      padding: 0.1rem 0.45rem; border-radius: 10px;
      background: #fef3c7; color: #92400e;
      white-space: nowrap; flex-shrink: 0;
    }
    .tool-priority-next {
      font-size: 0.65rem; font-weight: 700;
      padding: 0.1rem 0.45rem; border-radius: 10px;
      background: #f3f4f6; color: #9ca3af;
      white-space: nowrap; flex-shrink: 0;
    }

    /* ── Achievement Log ── */
    .log-form { display: flex; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .log-input-date {
      padding: 0.4rem 0.65rem; border: 1px solid #e8e0f5; border-radius: 8px;
      font-size: 0.82rem; color: #374151; background: #faf8ff;
      flex-shrink: 0;
    }
    .log-input-text {
      flex: 1; min-width: 180px; padding: 0.4rem 0.65rem;
      border: 1px solid #e8e0f5; border-radius: 8px;
      font-size: 0.82rem; color: #374151; background: #faf8ff;
      font-family: inherit;
    }
    .log-input-text:focus, .log-input-date:focus { outline: none; border-color: #c4b5fd; }
    .log-btn {
      padding: 0.4rem 1rem; background: #7c3aed; color: white;
      border: none; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .log-btn:hover { background: #6d28d9; }
    .log-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .log-entry {
      display: flex; align-items: flex-start; gap: 0.75rem;
      padding: 0.65rem 0.9rem; background: #f9f7ff;
      border-radius: 10px; border-left: 3px solid #c4b5fd;
    }
    .log-date { font-size: 0.72rem; color: #9ca3af; white-space: nowrap; flex-shrink: 0; padding-top: 0.1rem; }
    .log-text { font-size: 0.84rem; color: #374151; line-height: 1.55; flex: 1; }
    .log-del {
      background: none; border: none; color: #d1d5db; cursor: pointer;
      font-size: 0.9rem; line-height: 1; flex-shrink: 0; padding: 0.1rem 0.2rem;
    }
    .log-del:hover { color: #dc2626; }
    .log-empty { font-size: 0.82rem; color: #bbb; text-align: center; padding: 1rem 0; }

    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
      .projects-grid, .skills-grid, .unused-grid { grid-template-columns: 1fr; }
      .header, .progress-section, .main { padding-left: 1.5rem; padding-right: 1.5rem; }
      .tl-panel { flex-direction: column; }
      .tl-panel-img, .tl-panel-img-placeholder { width: 100%; height: 160px; }
    }
  </style>
</head>
<body>

<script>
// ════════════════════════════════════════════════════
//  DATA — Claude Code 自动维护此区块
// ════════════════════════════════════════════════════
const DATA = {
  lastUpdated: "2026-05-14",
  assessment: {
    level: 5,
    dimensions: {
      control: 6,   // 可控性：CLAUDE.md 配置扎实，但模板库/知识库缺失
      breadth: 7,   // 广度：跨领域（运营→编程→教育工具→自动化运维）
      form:    6,   // 形态：Claude Code Agent 自主执行，但仍较依赖引导
      role:    7    // 角色：SIE 工具交付 6 人使用，但尚未设计面向更广受众的产品
    }
  },

<script>
document.addEventListener('DOMContentLoaded', () => {
  const d = DATA;
  const lv = d.assessment.level;

  // ── Header ──
  document.getElementById('lv-num').textContent  = `Lv.${lv}`;
  document.getElementById('lv-name').textContent = d.levelNames[lv];
  document.getElementById('lv-desc').textContent = d.levelDescs[lv];

  // ── Progress bar ──
  const track = document.getElementById('progress-track');
  for (let i = 0; i <= 10; i++) {
    const s = document.createElement('div');
    s.className = 'progress-step' + (i < lv ? ' filled' : '') + (i === lv ? ' current' : '');
    s.setAttribute('data-label', `Lv.${i} ${d.levelNames[i]}`);
    track.appendChild(s);
  }
  const nextLv = lv < 10 ? lv + 1 : 10;
  document.getElementById('next-level-label').textContent =
    `下一级：Lv.${nextLv} ${d.levelNames[nextLv]}`;

  // ── Dimensions ──
  const dims = [
    { key: 'control', label: '可控性', sub: '约束 · 上下文 · Prompt 设计', improve: '建立 Prompt 模板库，把常用场景固定下来，减少每次从零设计的时间' },
    { key: 'breadth', label: '广度',   sub: '跨领域 · 工具栈扩张',         improve: '尝试 AI 辅助创意创作（图像/视频生成），向 Lv.8 双线并进方向推进' },
    { key: 'form',    label: '形态',   sub: 'ChatBot → Agent',             improve: '减少对 AI 的引导依赖——只说目标不说步骤，让 Agent 自主决策更多环节' },
    { key: 'role',    label: '角色',   sub: '消费者 → 创造者',             improve: '构建面向更广受众的产品，或指导他人建立自己的 AI 工作流' }
  ];
  const dimList = document.getElementById('dim-list');
  dims.forEach(dim => {
    const score = d.assessment.dimensions[dim.key];
    dimList.innerHTML += `
      <div class="dim-item">
        <div class="dim-header">
          <span class="dim-name">${dim.label} <span class="dim-sub">${dim.sub}</span></span>
          <span class="dim-score">${score}/10</span>
        </div>
        <div class="dim-bar"><div class="dim-fill" style="width:${score*10}%"></div></div>
        ${dim.improve ? `<div class="dim-improve">${dim.improve}</div>` : ''}
      </div>`;
  });

  // ── Radar chart ──
  try {
    const ctx = document.getElementById('radarChart').getContext('2d');
    new Chart(ctx, {
      type: 'radar',
      data: {
        labels: dims.map(d => d.label),
        datasets: [{
          label: '当前',
          data: dims.map(dim => d.assessment.dimensions[dim.key]),
          fill: true,
          backgroundColor: 'rgba(167,139,250,0.2)',
          borderColor: '#7c3aed',
          borderWidth: 2,
          pointBackgroundColor: '#7c3aed',
          pointRadius: 5
        }]
      },
      options: {
        scales: {
          r: {
            min: 0, max: 10, ticks: { stepSize: 2, display: false },
            grid: { color: '#ede9fe' },
            angleLines: { color: '#ede9fe' },
            pointLabels: { font: { size: 13, weight: '600' }, color: '#374151' }
          }
        },
        plugins: { legend: { display: false } },
        elements: { line: { tension: 0.1 } }
      }
    });
  } catch (e) {
    document.getElementById('radarChart').parentElement.innerHTML =
      '<div style="text-align:center;color:#bbb;padding:2rem;font-size:0.85rem">雷达图加载失败（CDN 不可用）</div>';
  }

  // ── Helpers ──
  function levelCompletion(i) {
    const ev = d.levelEvidence[i];
    if (!ev || !ev.criteria || !ev.criteria.length) return null;
    const score = ev.criteria.reduce((s, c) => s + (c.status === 'done' ? 1 : c.status === 'partial' ? 0.5 : 0), 0);
    return Math.round(score / ev.criteria.length * 100);
  }

  // ── Why card title ──
  document.getElementById('why-title').textContent = `为什么是 Lv.${lv} ${d.levelNames[lv]}`;
  document.getElementById('next-steps-title').textContent = `升到 Lv.${lv+1} ${d.levelNames[lv+1]} 还差什么`;

  // ── Why Lv card ──
  const whyList = document.getElementById('why-list');
  d.whyEvidence.forEach(e => {
    whyList.innerHTML += `
      <div class="why-item">
        <div class="why-check">✓</div>
        <div class="why-text"><span class="why-label">${e.label}</span> — ${e.detail}</div>
      </div>`;
  });

  // ── Level Progress Overview ──
  const overviewRows = document.getElementById('lp-overview-rows');
  for (let i = 3; i <= 10; i++) {
    const pct = levelCompletion(i);
    if (pct === null) continue;
    const isPast    = i < lv;
    const isCurrent = i === lv;
    const fillCls   = isPast ? 'lp-past' : isCurrent ? 'lp-current' : 'lp-future';
    let statusHtml = '';
    if (pct >= 85 && isPast)    statusHtml = `<span class="lp-status lp-status-done">已通关</span>`;
    else if (pct >= 85)         statusHtml = `<span class="lp-status lp-status-done">可晋级 ✓</span>`;
    else if (isCurrent)         statusHtml = `<span class="lp-status lp-status-current">进行中</span>`;
    else                        statusHtml = `<span class="lp-status lp-status-future">未解锁</span>`;
    overviewRows.innerHTML += `
      <div class="lp-row">
        <div class="lp-label">Lv.${i} ${d.levelNames[i]}</div>
        <div class="lp-bar"><div class="lp-bar-fill ${fillCls}" style="width:${pct}%"></div></div>
        <div class="lp-pct">${pct}%</div>
        ${statusHtml}
      </div>`;
  }

  // ── Timeline ──
  const pillsEl = document.getElementById('tl-pills');
  let activeTl = lv;

  function renderPanel(i) {
    const ev = d.levelEvidence[i];
    const isCurrent = i === lv;
    const isFuture = i > lv;
    const badge = isCurrent ? '<span class="tl-panel-badge">当前</span>'
                : isFuture  ? '<span class="tl-panel-badge future-badge">未到达</span>'
                :             '<span class="tl-panel-badge" style="background:#c4b5fd;color:#4c1d95">已达成</span>';
    const imgEl = ev.img
      ? `<img class="tl-panel-img" src="${ev.img}" alt="Lv.${i}" onerror="this.style.display='none'">`
      : `<div class="tl-panel-img-placeholder">${i}</div>`;

    let achievementEl = '';
    if (ev.userAchievements) {
      achievementEl = `
        <div class="user-achievement">
          <div class="user-achievement-label">${isCurrent ? '你现在正在做的' : '你是怎么到这一级的'}</div>
          <div class="user-achievement-text">${ev.userAchievements}</div>
        </div>`;
    } else if (isFuture) {
      achievementEl = `
        <div class="user-achievement" style="border-color:#e5e7eb;background:#f3f4f6">
          <div class="user-achievement-label" style="color:#9ca3af">还没到达</div>
          <div class="user-achievement-text" style="color:#9ca3af">继续前进，这一级等着你解锁！</div>
        </div>`;
    }

    let criteriaEl = '';
    if (ev.criteria && ev.criteria.length) {
      const pct = levelCompletion(i);
      const dotMap = { done: '✓', partial: '~', not: '✗' };
      const items = ev.criteria.map(c =>
        `<div class="criterion-item criterion-${c.status}">
          <div class="criterion-dot">${dotMap[c.status]}</div>
          <span class="criterion-text">${c.text}</span>
        </div>`
      ).join('');
      criteriaEl = `
        <div class="criteria-header">
          <span class="criteria-header-label">达成检查项</span>
          <span class="criteria-pct">${pct}%${pct >= 85 ? ' ✓' : ''}</span>
        </div>
        <div class="criteria-track"><div class="criteria-fill" style="width:${pct}%"></div></div>
        <div class="criteria-list">${items}</div>`;
    }

    document.getElementById('tl-panel').innerHTML = `
      ${imgEl}
      <div class="tl-panel-body">
        <div class="tl-panel-header">
          <span class="tl-panel-lv">Lv.${i}</span>
          <span class="tl-panel-name">${d.levelNames[i]}</span>
          ${badge}
        </div>
        <div class="tl-panel-desc">${d.levelDescs[i]}</div>
        <div class="tl-panel-evidence">${ev.text}</div>
        ${achievementEl}
        ${criteriaEl}
      </div>`;
  }

  for (let i = 0; i <= 10; i++) {
    const pill = document.createElement('div');
    const cls = i < lv ? 'past' : i === lv ? 'current' : 'future';
    pill.className = `tl-pill ${cls}${i === activeTl ? ' active' : ''}`;
    pill.textContent = `${i} ${d.levelNames[i]}`;
    pill.dataset.lv = i;
    pill.addEventListener('click', () => {
      activeTl = i;
      document.querySelectorAll('.tl-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      renderPanel(i);
    });
    pillsEl.appendChild(pill);
  }
  renderPanel(activeTl);

  // ── Next steps ──
  const stepsList = document.getElementById('steps-list');
  d.nextSteps.forEach((step, i) => {
    stepsList.innerHTML += `
      <li>
        <div class="step-icon">${i + 1}</div>
        <span>${step}</span>
      </li>`;
  });

  // ── Projects ──
  const tagClass = { automation: 'tag-automation', ai: 'tag-ai', infra: 'tag-infra', frontend: 'tag-frontend', prompt: 'tag-prompt' };
  const grid = document.getElementById('projects-grid');
  d.projects.forEach((proj, idx) => {
    const fileUrl = 'file:///' + proj.path.replace(/\\/g, '/');
    const techRows = proj.techniques.map(t =>
      `<div class="tech-row">
        <span class="tag ${tagClass[t.cat] || ''}">${t.name}</span>
        <span class="tech-use">${t.use}</span>
      </div>`
    ).join('');

    let detailHtml = '';
    if (proj.details) {
      const sectionsHtml = proj.details.sections.map(s =>
        `<div class="detail-section">
          <div class="detail-section-title">${s.title}</div>
          <ul class="detail-section-list">${s.items.map(i => `<li>${i}</li>`).join('')}</ul>
        </div>`
      ).join('');
      detailHtml = `
        <button class="project-detail-toggle" data-idx="${idx}">▼ 查看详细配置</button>
        <div class="project-detail-panel" id="detail-panel-${idx}">
          <div class="detail-workflow">${proj.details.workflow}</div>
          ${sectionsHtml}
        </div>`;
    }

    grid.innerHTML += `
      <div class="project-card">
        <div class="project-header">
          <div class="project-name">${proj.name}</div>
          <a class="project-open" href="${fileUrl}" title="在文件浏览器中打开">打开</a>
        </div>
        <div class="project-path">${proj.path}</div>
        <div class="project-desc">${proj.desc}</div>
        <div class="techniques">${techRows}</div>
        ${detailHtml}
      </div>`;
  });

  // ── Achievement Log ──
  const LOG_KEY = 'ai-growth-log';
  function loadLog() { try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch { return []; } }
  function saveLog(entries) { localStorage.setItem(LOG_KEY, JSON.stringify(entries)); }
  function renderLog() {
    const entries = loadLog();
    const list = document.getElementById('log-list');
    if (!entries.length) {
      list.innerHTML = '<div class="log-empty">还没有记录，写下第一条成长笔记吧</div>';
      return;
    }
    list.innerHTML = entries.slice().reverse().map((e, ri) => {
      const i = entries.length - 1 - ri;
      return `<div class="log-entry">
        <span class="log-date">${e.date}</span>
        <span class="log-text">${e.text.replace(/</g,'&lt;')}</span>
        <button class="log-del" data-i="${i}" title="删除">×</button>
      </div>`;
    }).join('');
  }
  // default date = today
  const todayStr = new Date().toISOString().slice(0, 10);
  document.getElementById('log-date').value = todayStr;

  document.getElementById('log-add').addEventListener('click', () => {
    const date = document.getElementById('log-date').value || todayStr;
    const text = document.getElementById('log-text').value.trim();
    if (!text) return;
    const entries = loadLog();
    entries.push({ date, text });
    saveLog(entries);
    document.getElementById('log-text').value = '';
    renderLog();
  });
  document.getElementById('log-list').addEventListener('click', e => {
    const btn = e.target.closest('.log-del');
    if (!btn) return;
    const entries = loadLog();
    entries.splice(+btn.dataset.i, 1);
    saveLog(entries);
    renderLog();
  });
  renderLog();

  document.getElementById('projects-grid').addEventListener('click', e => {
    const btn = e.target.closest('.project-detail-toggle');
    if (!btn) return;
    const panel = document.getElementById(`detail-panel-${btn.dataset.idx}`);
    const isOpen = panel.classList.toggle('open');
    btn.textContent = isOpen ? '▲ 收起' : '▼ 查看详细配置';
  });

  // ── Skills ──
  const skillCatClass = {
    workflow: 'skill-cat-workflow', debug: 'skill-cat-debug',
    memory: 'skill-cat-memory', infra: 'skill-cat-infra', data: 'skill-cat-data',
    frontend: 'skill-cat-frontend'
  };
  const skillsGrid = document.getElementById('skills-grid');
  const originLabel = { 'self': '自封装', 'global': '全局skill', 'project': '项目skill' };
  d.skills.forEach(sk => {
    const badge = sk.origin
      ? `<span class="origin-badge origin-${sk.origin}">${originLabel[sk.origin] || sk.origin}</span>`
      : '';
    skillsGrid.innerHTML += `
      <div class="skill-card ${skillCatClass[sk.cat] || ''}">
        <div class="skill-header">
          <span class="skill-name">${sk.name}</span>
          <span class="skill-invoke">${sk.invoke}</span>
          ${badge}
        </div>
        <div class="skill-desc">${sk.desc}</div>
        <div class="skill-trigger">${sk.trigger}</div>
        ${sk.tip ? `<div class="skill-tip">${sk.tip}</div>` : ''}
      </div>`;
  });

  // ── Unused Tools ──
  const unusedCatClass = {
    automation: 'unused-cat-automation', infra: 'unused-cat-infra',
    frontend: 'unused-cat-frontend', ai: 'unused-cat-ai'
  };
  const unusedGrid = document.getElementById('unused-grid');
  d.unusedTools.forEach(tool => {
    const priorityBadge = tool.priority === 'now'
      ? `<span class="tool-priority-now">立即探索</span>`
      : `<span class="tool-priority-next">下一阶段</span>`;
    unusedGrid.innerHTML += `
      <div class="unused-card ${unusedCatClass[tool.cat] || ''}">
        <div class="unused-header">
          <span class="unused-name">${tool.name}</span>
          <span class="tag ${tagClass[tool.cat] || ''}">${tool.cat}</span>
          ${priorityBadge}
        </div>
        <div class="unused-desc">${tool.desc}</div>
      </div>`;
  });
});
</script>

<!-- ── Markup ── -->
<div class="header">
  <img class="header-bg-img" src="images/header-bg.png" alt="">
  <div class="header-top">
    <div>
      <div class="header-label">Jean的 AI 成长仪表板</div>
      <div class="level-row">
        <div class="level-num" id="lv-num"></div>
        <div class="level-name" id="lv-name"></div>
      </div>
      <div class="level-desc" id="lv-desc"></div>
    </div>
  </div>
</div>

<div class="progress-section">
  <div class="progress-meta">
    <span class="progress-meta-label">等级进度 Lv.0 → Lv.10</span>
    <span class="progress-meta-next" id="next-level-label"></span>
  </div>
  <div class="progress-track" id="progress-track"></div>
  <div class="progress-labels">
    <span>Lv.0 旁观者</span>
    <span>Lv.5 织网者</span>
    <span>Lv.10 一人军团</span>
  </div>
</div>

<div class="main">
  <div class="grid-2">
    <div class="card">
      <div class="card-title">四维度评估</div>
      <div class="dim-list" id="dim-list"></div>
    </div>
    <div class="card">
      <div class="card-title">能力雷达</div>
      <div class="radar-wrap">
        <canvas id="radarChart"></canvas>
      </div>
    </div>
  </div>

  <div class="card why-card">
    <div class="card-title" id="why-title"></div>
    <div class="why-list" id="why-list"></div>
  </div>

  <div class="card" style="margin-bottom:1.5rem">
    <div class="card-title">各级完成进度 — 达到 85% 方进入下一级</div>
    <div id="lp-overview-rows"></div>
  </div>

  <div class="card timeline-card">
    <div class="card-title">等级时间轴 — 点击查看每级详情 &amp; 你的达成故事</div>
    <div class="timeline-pills" id="tl-pills"></div>
    <div id="tl-panel" class="tl-panel"></div>
  </div>

  <div class="card" style="margin-bottom:1.5rem">
    <div class="card-title" id="next-steps-title"></div>
    <ul class="steps-list" id="steps-list"></ul>
  </div>

  <div class="section-title">项目 · 技能清单</div>
  <div class="projects-grid" id="projects-grid"></div>

  <div style="margin-top:1.75rem">
    <div class="section-title">Claude Code Skills — 已配置的 15 个全局技能（~/.claude/skills/）</div>
    <div class="card">
      <div class="card-title">调用方式：在对话中直接输入斜杠命令，或满足触发条件时自动激活</div>
      <div class="skills-grid" id="skills-grid"></div>
    </div>
  </div>

  <div style="margin-top:1.75rem; margin-bottom:1.5rem">
    <div class="section-title">成长日志 — 记录每一个 AI 里程碑</div>
    <div class="card">
      <div class="log-form">
        <input type="date" class="log-input-date" id="log-date">
        <input type="text" class="log-input-text" id="log-text" placeholder="记录今天的 AI 突破或新发现…">
        <button class="log-btn" id="log-add">记录</button>
      </div>
      <div class="log-list" id="log-list"></div>
    </div>
  </div>

  <div style="margin-top:1.75rem; margin-bottom:1rem">
    <div class="section-title">工具探索地图</div>
    <div class="unused-grid" id="unused-grid"></div>
  </div>

  <p style="text-align:right;font-size:0.75rem;color:#bbb;margin-top:1.5rem;padding-bottom:1rem">
    由 Claude Code 自动维护
  </p>
</div>
